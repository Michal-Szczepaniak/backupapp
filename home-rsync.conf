; home directory synced to a server over ssh with rsync
name=Home (rsync)

sourceType=directory
directory=/home/defaultuser

destinationType=rsync

; ssh host and login
rsyncHost=server.example.com
rsyncUser=alice

; empty defaults to 22
rsyncPort=

; remote directory to sync into
rsyncPath=/srv/backup/phone-home

; private key used to log in, must not require a passphrase
rsyncKey=/home/defaultuser/.ssh/id_ed25519

; extra rsync arguments appended after the defaults, separated by spaces; quote the value if it contains commas
rsyncOptions="--delete --exclude=.cache"
