; full rootfs backup of a hybris install, restored into /data/.stowaways/sailfishos-backup
name=Full backup

sourceType=directory
directory=/data/.stowaways/sailfishos

destinationType=webdav
webdavType=https
webdavHost=cloud.example.com
webdavRoot=
webdavUser=alice
webdavPassword=secret
webdavUserId=alice
webdavPath=/backupapp/full

keepBackups=3
