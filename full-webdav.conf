; full system backup, restored into /backup and swapped in by a preinit oneshot on next boot
name=Full backup

sourceType=directory
fullSystemBackup=true
directory=/bin,/boot,/etc,/home,/lib,/media,/opt,/root,/sbin,/srv,/usr,/var

destinationType=webdav
webdavType=https
webdavHost=cloud.example.com
webdavRoot=
webdavUser=alice
webdavPassword=secret
webdavUserId=alice
webdavPath=/backupapp/full

keepBackups=3
